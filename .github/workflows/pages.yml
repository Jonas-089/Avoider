# Builds avoider.jar and publishes it with web/index.html to GitHub Pages,
# so the game can be played in the browser via CheerpJ.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build avoider.jar
        run: |
          # CheerpJ runs Java 8 by default, so compile for Java 8
          javac --release 8 -d build/classes *.java
          mkdir -p site
          jar --create --file site/avoider.jar --main-class MoveTest.Main -C build/classes .
          cp web/index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
